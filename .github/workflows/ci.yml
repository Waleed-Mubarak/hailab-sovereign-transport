name: Sovereign Transport CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Tests Directly
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tests/test_sovereign_transport.py
          python tests/test_dtn_simulator.py
