name: Sovereign Transport CI - Elite Defense Grade

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies and Package
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # البحث عن المجلد الذي يحتوي على pyproject.toml والتثبيت منه مباشرة
          TARGET_DIR=$(find . -maxdepth 2 -name "pyproject.toml" -exec dirname {} \;)
          echo "Found project at: $TARGET_DIR"
          cd "$TARGET_DIR"
          pip install -e .

      - name: Run Pytest Security Suite
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -name "pyproject.toml" -exec dirname {} \;)
          cd "$TARGET_DIR"
          python -m pytest -v
