name: Sovereign Transport CI - Elite Defense Grade

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies & Package
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # إنشاء setup.py مؤقت وسريع لضمان رؤية بايثون لكل الملفات الفردية في الجذر
          echo "from setuptools import setup" > setup.py
          echo "setup(name='hailab-sovereign', version='0.1.0', py_modules=['wp6_pqc_layer', 'cbt_compatibility_layer', 'cryptography_security_layer', 'sovereign_transport_kernel', 'ai_sovereign_bridge', 'audit_verifier', 'chaos_sim', 'hailab_sovereign'])" >> setup.py
          pip install -e .

      - name: Run Pytest Security Suite
        run: |
          pytest -v
