name: Sovereign Transport CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Package and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .

    - name: Run WP6 Test Directly
      run: |
        python test_wp6_pqc.py

    - name: Run WP2 Tests via Pytest
      run: |
        pytest test_wp2_sim.py -v
