name: Sovereign Transport CI - Final Elite Defense

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade Pip and Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install Project in Editable Mode
        run: |
          pip install -e .

      - name: Run Master Pytest Regression Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v
