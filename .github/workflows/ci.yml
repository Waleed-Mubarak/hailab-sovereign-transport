name: Sovereign Transport CI - Elite Defense Grade

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify Immutable Commit and Environment
        run: |
          echo "Executing pipeline for commit SHA: ${{ github.sha }}"
          echo "Target candidate code is locked and isolated from production alterations."

      - name: Execute Full Security Regression and Pytest Suite
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --import-mode=importlib --strict-markers
